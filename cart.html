<style>

.cart-container {
    padding: 70px 0;
}

.cart-item {
    background: white;

    padding: 20px;

    margin-bottom: 15px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.06);
}

.cart-item h5 {
    font-weight: 700;
}

.cart-item p {
    color: #ff6b00;
    margin: 0;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 12px;
}

.quantity button {
    border: none;

    background: #111;

    color: white;

    width: 32px;
    height: 32px;

    border-radius: 50%;
}

.remove-btn {
    border: none;
    background: none;
    color: #ff6b00;
}

.cart-total {
    background: #111;
    color: white;

    padding: 25px;

    border-radius: 12px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

@media(max-width:600px) {

    .cart-item {
        flex-direction: column;
        align-items: flex-start;
    }

    .cart-total {
        flex-direction: column;
        gap: 20px;
    }

}

</style>

</head>

</a>

</div>

</nav>

Your Cart
</h1>

</div>

</section>
