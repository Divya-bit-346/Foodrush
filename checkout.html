<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FoodRush - Checkout</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body>


<nav class="navbar navbar-dark food-navbar">

<div class="container">

<a
class="navbar-brand food-logo"
href="index.html">

Food<span>Rush</span>

</a>

</div>

</nav>


<section class="section-padding">

<div class="container">

<h1 class="mb-4">
Checkout
</h1>

<div class="row">


<div class="col-md-7">

<div class="card border-0 shadow p-4">

<h4>
Delivery Information
</h4>

<div class="mb-3">

<label>
Full Name
</label>

<input
type="text"
class="form-control"
placeholder="Enter name">

</div>


<div class="mb-3">

<label>
Phone Number
</label>

<input
type="text"
class="form-control"
placeholder="Enter phone number">

</div>


<div class="mb-3">

<label>
Delivery Address
</label>

<textarea
class="form-control"
rows="4"
placeholder="Enter complete address"></textarea>

</div>


<h5>
Payment Method
</h5>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment"
checked>

<label>
Cash on Delivery
</label>

</div>


<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment">

<label>
UPI
</label>

</div>


<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment">

<label>
Card
</label>

</div>

</div>

</div>


<div class="col-md-5">

<div class="card border-0 shadow p-4">

<h4>
Order Summary
</h4>

<hr>

<p>
Food Items
<span class="float-end">
₹667
</span>
</p>

<p>
Delivery Fee
<span class="float-end">
₹30
</span>
</p>

<hr>

<h4>
Total
<span class="float-end"
style="color:#ff6b00;">
₹697
</span>
</h4>

<button
class="btn food-btn w-100 mt-4">

Place Order

</button>

</div>

</div>


</div>

</div>

</section>

</body>

</html>
