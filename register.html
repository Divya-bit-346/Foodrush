<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FoodRush - Register</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="C:\Users\ELCOT\Desktop\f1\style.css">

</head>

<body>


<div class="container">

<div class="row justify-content-center">

<div class="col-md-6 my-5">

<div class="card shadow border-0 p-4">

<h2 class="text-center">

Create FoodRush Account

</h2>

<p class="text-center text-muted">
Join FoodRush and order delicious food.
</p>


<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>
Full Name
</label>

<input
type="text"
class="form-control"
placeholder="Your name"
required>

</div>


<div class="col-md-6 mb-3">

<label>
Phone
</label>

<input
type="text"
class="form-control"
placeholder="Phone number"
required>

</div>

</div>


<div class="mb-3">

<label>
Email
</label>

<input
type="email"
class="form-control"
placeholder="Email address"
required>

</div>


<div class="mb-3">

<label>
Address
</label>

<textarea
class="form-control"
rows="3"
placeholder="Delivery address"></textarea>

</div>


<div class="mb-3">

<label>
Password
</label>

<input
type="password"
class="form-control"
placeholder="Create password"
required>

</div>


<button
class="btn food-btn w-100">

Create Account

</button>


<p class="text-center mt-3">

Already have an account?

<a
href="C:\Users\ELCOT\Desktop\f1\login.html"
style="color:#ff6b00;">

Login

</a>

</p>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
